name: Render Baya demo v3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: film
    env:
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: film/package-lock.json
      - name: Check browser and install dependencies
        run: |
          test -x "$REMOTION_BROWSER_EXECUTABLE"
          npm ci --no-audit --no-fund
      - name: Typecheck and render
        run: |
          npm run typecheck
          npm run sound:v3
          npm run render:v3
          npm run stills:v3
      - name: Install artifact tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Assemble contact sheet and inspect export
        run: |
          npm run contact-sheet:v3
          npm run verify:v3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baya-full-demo-v3-1080p
          path: renders/
          retention-days: 30
          if-no-files-found: error
