name: Render approved Baya film
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: film
    env:
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: film/package-lock.json
      - name: Install dependencies and export tools
        run: |
          test -x "$REMOTION_BROWSER_EXECUTABLE"
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check approved scene and asset snapshot
        run: python3 ../handoff/verify-snapshot.py
      - name: Typecheck and render the approved full film
        run: |
          npm run typecheck
          npm run render:approved
      - name: Decode export and extract representative stills
        run: npm run verify:approved
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baya-approved-full-${{ github.sha }}
          path: |
            renders/baya-approved-full.mp4
            renders/approved-review/
          retention-days: 90
          if-no-files-found: error
